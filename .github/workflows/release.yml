name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual runs must be started on a tag (choose it in "Use workflow from"); branches are refused.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds and signs the APK. This is the only job that can read the signing secrets; it runs in
  # the "release" environment, so every run needs an approval, and it has no write access.
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only commits that reached main through a reviewed pull request may be signed.
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Matches gradle/gradle-daemon-jvm.properties (JDK 25, any vendor), so Gradle reuses it
      # instead of downloading a toolchain.
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      # Read-only cache: a release build must not write a cache that other runs would restore.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Derive version name from tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Secrets go through env: — expanded inside run: they would be parsed as shell code.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # .properties treats '\' as an escape character and drops leading spaces of a value.
          esc() {
            local v="${1//\\/\\\\}"
            if [ "${v:0:1}" = " " ]; then v="\\$v"; fi
            printf '%s' "$v"
          }
          {
            echo "storeFile=release.keystore.jks"
            echo "storePassword=$(esc "$STORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > app/keystore.properties

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME" \
            --stacktrace

      - name: Clean up signing files
        if: always()
        run: rm -f app/release.keystore.jks app/keystore.properties

      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk whisker-grid.apk

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: whisker-grid.apk
          if-no-files-found: error

  # Publishes the release. Has write access but never sees the signing secrets.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: whisker-grid.apk
          generate_release_notes: true
